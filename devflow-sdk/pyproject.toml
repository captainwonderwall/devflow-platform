[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-sdk"
version = "1.2.10"
description = "Shared utilities and plugin interface for devflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "questionary==2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.0", "import-linter>=2.0"]

[tool.setuptools.package-data]
devflow_sdk = ["core/config/wizard/tools/models_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "devflow_sdk"

[[tool.importlinter.contracts]]
name = "SDK layers"
type = "layers"
layers = [
    "devflow_sdk.domain",
    "devflow_sdk.plugin",
    "devflow_sdk.core",
]
ignore_imports = [
    # Deprecation shim only; delete this line when core/plugin/ is removed.
    "devflow_sdk.core.plugin -> devflow_sdk.plugin",
]

[[tool.importlinter.contracts]]
name = "Domains are independent of each other"
type = "independence"
modules = [
    "devflow_sdk.domain.issue",
    "devflow_sdk.domain.workspace",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-sdk"
version = "1.2.7"
description = "Shared utilities and plugin interface for devflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "questionary==2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.0", "import-linter>=2.0"]

[tool.setuptools.package-data]
devflow_sdk = ["core/config/wizard/tools/models_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "devflow_sdk"

[[tool.importlinter.contracts]]
name = "Core must not import from domain"
type = "forbidden"
source_modules = ["devflow_sdk.core"]
forbidden_modules = ["devflow_sdk.domain"]

[[tool.importlinter.contracts]]
name = "Domains are independent of each other"
type = "independence"
modules = [
    "devflow_sdk.domain.issue",
    "devflow_sdk.domain.workspace",
]

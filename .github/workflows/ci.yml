name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run --directory devflow-sdk --extra dev pytest
      - name: Check import boundaries
        run: uv run --directory devflow-sdk --extra dev lint-imports

  devflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run --directory devflow-sdk --extra dev pytest ../devflow/

  scaffold-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: DEVFLOW_SDK="${{ github.workspace }}/devflow-sdk" bash devflow-plugin-scaffold/tests/test_scaffold.sh
